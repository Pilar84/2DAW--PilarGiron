<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Listado de Artistas</title>
</head>
<body>
    <h1>Listado de Artistas</h1>

    <table border="1">
        <tr>
            <th>Nombre</th>
            <th>País</th>
            <th>Acciones</th>
        </tr>
        {% for artist in artists %}
        <tr>
            <td><a href="{% url 'artist_detail' artist.id %}">{{ artist.name }}</a></td>
            <td>{{ artist.country }}</td>
            <td>
                <a href="{% url 'artist_edit' artist.id %}">Editar</a> |
                <a href="{% url 'artist_delete' artist.id %}">Borrar</a>
            </td>
        </tr>
        {% empty %}
        <tr>
            <td colspan="3">No hay artistas registrados.</td>
        </tr>
        {% endfor %}
    </table>

    <a href="{% url 'artist_create' %}">Crear nuevo artista</a>
</body>
</html>
