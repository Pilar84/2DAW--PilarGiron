<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Hola con jQuery</title>

    <!-- CDN de jQuery -->
    <script src="jquery-4.0.0.min.js"></script>

    <script>
        $(document).ready(function () {
            $("#btnSaludar").click(function () {
                alert("¡Hola!");
            });
        });
    </script>
</head>

<body>

    <h1>Hola con jQuery</h1>

    <button id="btnSaludar">Saludar</button>

</body>

</html>
